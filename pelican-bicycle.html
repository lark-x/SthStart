<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 120% at 30% 10%, #24486b 0%, #101d2e 60%, #0a1220 100%);
    overflow: hidden;
  }

  .stage {
    width: min(94vw, 1120px);
    aspect-ratio: 8 / 5;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .1);
  }

  svg { display: block; width: 100%; height: 100%; }

  /* ============ 通用 ============ */
  .spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin .82s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .scroll { animation: scrollX 2s linear infinite; }
  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }

  /* ============ 天空 ============ */
  .sun-rays {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 70s linear infinite;
  }
  .cloud-row-a { animation-duration: 46s; }
  .cloud-row-b { animation-duration: 64s; }
  .hills-row   { animation-duration: 9s; }
  .grass-row   { animation-duration: 1.33s; }

  .birds { animation: flyby 28s linear infinite; }
  @keyframes flyby {
    from { transform: translateX(880px); }
    to   { transform: translateX(-180px); }
  }

  /* 路面虚线：400px/s，一个周期 96px → 0.24s */
  .road-dash { animation: dashMove .24s linear infinite; }
  @keyframes dashMove {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 96px; }
  }

  /* 链条：随曲柄转动 */
  .chain {
    stroke-dasharray: 5 5;
    animation: chainMove .115s linear infinite;
  }
  @keyframes chainMove {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -10px; }
  }

  /* ============ 蹬车动作（8 帧定格） ============ */
  .pose {
    opacity: 0;
    animation: poseOn 1.08s step-end infinite;
  }
  @keyframes poseOn {
    0%    { opacity: 1; }
    12.5% { opacity: 0; }
  }

  .leg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .leg-near { stroke: #ff9a4d; stroke-width: 12; }
  .leg-far  { stroke: #d9772f; stroke-width: 10; }
  .foot-near { fill: #ffb066; }
  .foot-far  { fill: #e08a45; }

  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.08s linear infinite;
  }

  /* ============ 骑行者 ============ */
  .rider {
    transform-box: fill-box;
    transform-origin: center;
    animation: bounce 1.08s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-4px) rotate(-.6deg); }
  }

  .head-g { animation: headBob 1.08s ease-in-out infinite; }
  @keyframes headBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(2.5px); }
  }

  .wing {
    transform-box: fill-box;
    transform-origin: center;
    animation: flap 1.08s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-2.2deg); }
  }

  .tail {
    transform-box: fill-box;
    transform-origin: center;
    animation: tailWag 1.08s ease-in-out infinite;
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(4deg); }
  }

  .blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 3.6s infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(.08); }
  }

  .pouch-g {
    transform-box: fill-box;
    transform-origin: center;
    animation: pouchWob 1.7s ease-in-out infinite;
  }
  @keyframes pouchWob {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05, 1.09); }
  }

  /* ============ 氛围效果 ============ */
  .dust {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: puff .9s linear infinite;
  }
  @keyframes puff {
    0%   { opacity: 0;   transform: translate(0, 0) scale(.4); }
    15%  { opacity: .7; }
    100% { opacity: 0;   transform: translate(-72px, -28px) scale(1.5); }
  }

  .whoosh {
    opacity: 0;
    animation: whoosh .8s linear infinite;
  }
  @keyframes whoosh {
    0%   { opacity: 0;   transform: translateX(50px); }
    25%  { opacity: .6; }
    100% { opacity: 0;   transform: translateX(-170px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-play-state: paused !important; }
  }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的二维动画">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#a8e4ff"/>
      <stop offset=".65" stop-color="#ddf5ff"/>
      <stop offset="1"   stop-color="#fff4d4"/>
    </linearGradient>

    <!-- 云朵（以原点为中心） -->
    <g id="puff" fill="#ffffff">
      <ellipse cx="0"   cy="0"   rx="40" ry="20"/>
      <ellipse cx="-30" cy="8"   rx="26" ry="14"/>
      <ellipse cx="30"  cy="9"   rx="28" ry="13"/>
      <ellipse cx="6"   cy="-16" rx="24" ry="16"/>
    </g>

    <g id="cloudrowA" opacity=".92">
      <use href="#puff" x="110" y="90"/>
      <use href="#puff" x="420" y="64"/>
      <use href="#puff" x="655" y="100"/>
    </g>

    <g id="cloudrowB" opacity=".8">
      <use href="#puff" x="60"  y="168"/>
      <use href="#puff" x="270" y="150"/>
      <use href="#puff" x="560" y="172"/>
      <use href="#puff" x="762" y="148"/>
    </g>

    <!-- 远山 -->
    <g id="hills" fill="#8fd6bd" fill-opacity=".9">
      <path d="M 0 364 C 60 296, 168 296, 246 364 Z"/>
      <path d="M 216 364 C 292 320, 372 320, 448 364 Z"/>
      <path d="M 420 364 C 512 284, 628 284, 716 364 Z"/>
      <path d="M 686 364 C 726 332, 774 332, 800 364 Z"/>
    </g>

    <!-- 中景：树木与栅栏 -->
    <g id="trees">
      <rect x="84" y="342" width="14" height="38" rx="4" fill="#8b5a2b"/>
      <circle cx="91"  cy="316" r="27" fill="#3f9e4b"/>
      <circle cx="72"  cy="332" r="18" fill="#357f3f"/>
      <circle cx="110" cy="332" r="18" fill="#357f3f"/>

      <ellipse cx="204" cy="368" rx="28" ry="14" fill="#4faa52"/>
      <ellipse cx="184" cy="372" rx="18" ry="10" fill="#3f9e4b"/>
      <ellipse cx="224" cy="372" rx="18" ry="10" fill="#3f9e4b"/>

      <rect x="324" y="348" width="12" height="32" rx="4" fill="#8b5a2b"/>
      <circle cx="330" cy="330" r="22" fill="#3f9e4b"/>
      <circle cx="316" cy="342" r="14" fill="#4faa52"/>
      <circle cx="344" cy="342" r="14" fill="#4faa52"/>

      <g fill="#b0895a">
        <rect x="430" y="350" width="7" height="30" rx="2"/>
        <rect x="472" y="350" width="7" height="30" rx="2"/>
        <rect x="514" y="350" width="7" height="30" rx="2"/>
        <rect x="556" y="350" width="7" height="30" rx="2"/>
        <rect x="424" y="356" width="146" height="6" rx="3"/>
        <rect x="424" y="370" width="146" height="6" rx="3"/>
      </g>

      <ellipse cx="630" cy="370" rx="24" ry="12" fill="#4faa52"/>
      <ellipse cx="652" cy="373" rx="16" ry="9"  fill="#3f9e4b"/>

      <rect x="712" y="344" width="13" height="36" rx="4" fill="#8b5a2b"/>
      <circle cx="718" cy="322" r="25" fill="#3f9e4b"/>
      <circle cx="702" cy="336" r="16" fill="#357f3f"/>
      <circle cx="734" cy="336" r="16" fill="#357f3f"/>
    </g>

    <!-- 前景草叶 / 石子 / 小花 -->
    <g id="fggrass">
      <path d="M 40 500 L 50 472 L 60 500 Z"  fill="#4f9a3c"/>
      <path d="M 58 500 L 66 481 L 74 500 Z"  fill="#458a36"/>
      <ellipse cx="132" cy="494" rx="16" ry="7" fill="#93a89b"/>
      <path d="M 178 500 L 188 474 L 198 500 Z" fill="#4f9a3c"/>
      <line x1="252" y1="500" x2="252" y2="480" stroke="#3f8f36" stroke-width="3"/>
      <circle cx="252" cy="477" r="6" fill="#ff7b9c"/>
      <path d="M 330 500 L 342 470 L 354 500 Z" fill="#458a36"/>
      <ellipse cx="410" cy="493" rx="14" ry="6" fill="#93a89b"/>
      <path d="M 470 500 L 480 476 L 490 500 Z" fill="#4f9a3c"/>
      <line x1="556" y1="500" x2="556" y2="482" stroke="#3f8f36" stroke-width="3"/>
      <circle cx="556" cy="479" r="6" fill="#ffd166"/>
      <path d="M 620 500 L 632 472 L 644 500 Z" fill="#458a36"/>
      <path d="M 700 500 L 709 480 L 718 500 Z" fill="#4f9a3c"/>
      <ellipse cx="762" cy="494" rx="15" ry="7" fill="#93a89b"/>
    </g>

    <!-- 小鸟 -->
    <g id="bird" fill="none" stroke="#2b3a4a" stroke-width="3" stroke-linecap="round">
      <path d="M -14 0 C -8 -8, -4 -8, 0 0 C 4 -8, 8 -8, 14 0"/>
    </g>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <g class="sun-rays" stroke="#ffde8a" stroke-width="5" stroke-linecap="round">
    <line x1="742" y1="70"  x2="758" y2="70"/>
    <line x1="729.7" y1="99.7"  x2="741" y2="111"/>
    <line x1="700" y1="112" x2="700" y2="128"/>
    <line x1="670.3" y1="99.7"  x2="659" y2="111"/>
    <line x1="658" y1="70"  x2="642" y2="70"/>
    <line x1="670.3" y1="40.3" x2="659" y2="29"/>
    <line x1="700" y1="28"  x2="700" y2="12"/>
    <line x1="729.7" y1="40.3" x2="741" y2="29"/>
  </g>
  <circle cx="700" cy="70" r="32" fill="#ffd166"/>

  <!-- 云 -->
  <g class="scroll cloud-row-a">
    <use href="#cloudrowA"/>
    <use href="#cloudrowA" x="800"/>
  </g>
  <g class="scroll cloud-row-b">
    <use href="#cloudrowB"/>
    <use href="#cloudrowB" x="800"/>
  </g>

  <!-- 飞鸟 -->
  <g class="birds">
    <use href="#bird" x="180" y="120"/>
    <use href="#bird" x="214" y="132"/>
  </g>
  <g class="birds" style="animation-duration:34s; animation-delay:-14s;">
    <use href="#bird" x="520" y="76"/>
    <use href="#bird" x="548" y="86"/>
  </g>

  <!-- 远山 -->
  <g class="scroll hills-row">
    <use href="#hills"/>
    <use href="#hills" x="800"/>
  </g>

  <!-- 草地 -->
  <rect x="0" y="354" width="800" height="66" fill="#7cc95f"/>
  <rect x="0" y="354" width="800" height="6"  fill="#6bb84f"/>

  <!-- 中景树木 -->
  <g class="scroll trees-row">
    <use href="#trees"/>
    <use href="#trees" x="800"/>
  </g>

  <!-- 马路 -->
  <rect x="0" y="420" width="800" height="50" fill="#565b66"/>
  <rect x="0" y="420" width="800" height="4"  fill="#6d7482"/>
  <rect x="0" y="466" width="800" height="4"  fill="#454a54"/>
  <line class="road-dash" x1="0" y1="452" x2="800" y2="452"
        stroke="#f5f5f2" stroke-width="5" stroke-dasharray="48 48"/>

  <!-- 前景草地 -->
  <rect x="0" y="470" width="800" height="30" fill="#5aad45"/>
  <g class="scroll grass-row">
    <use href="#fggrass"/>
    <use href="#fggrass" x="800"/>
  </g>

  <!-- 速度线与扬尘 -->
  <g class="whoosh" style="animation-delay:0s">
    <rect x="140" y="252" width="100" height="5" rx="2.5" fill="#ffffff"/>
  </g>
  <g class="whoosh" style="animation-delay:.27s">
    <rect x="120" y="304" width="120" height="5" rx="2.5" fill="#ffffff"/>
  </g>
  <g class="whoosh" style="animation-delay:.53s">
    <rect x="150" y="352" width="90"  height="5" rx="2.5" fill="#ffffff"/>
  </g>

  <g class="dust" style="animation-delay:0s">
    <circle cx="300" cy="414" r="10" fill="#ded7c9"/>
  </g>
  <g class="dust" style="animation-delay:.3s">
    <circle cx="292" cy="410" r="8"  fill="#ded7c9"/>
  </g>
  <g class="dust" style="animation-delay:.6s">
    <circle cx="284" cy="416" r="9"  fill="#ded7c9"/>
  </g>

  <!-- ================= 骑行者 ================= -->
  <g class="rider">

    <!-- ===== 远侧腿（被车架遮挡） ===== -->
    <g class="pose" style="animation-delay:.54s">
      <polyline class="leg leg-far" points="360,280 417,304 426,365"/>
      <ellipse class="foot-far" cx="426" cy="361" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.675s">
      <polyline class="leg leg-far" points="360,280 405,323 418,383"/>
      <ellipse class="foot-far" cx="418" cy="379" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.81s">
      <polyline class="leg leg-far" points="360,280 398,329 400,391"/>
      <ellipse class="foot-far" cx="400" cy="387" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.945s">
      <polyline class="leg leg-far" points="360,280 403,325 382,383"/>
      <ellipse class="foot-far" cx="382" cy="379" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:0s">
      <polyline class="leg leg-far" points="360,280 411,315 374,365"/>
      <ellipse class="foot-far" cx="374" cy="361" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.135s">
      <polyline class="leg leg-far" points="360,280 420,298 382,347"/>
      <ellipse class="foot-far" cx="382" cy="343" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.27s">
      <polyline class="leg leg-far" points="360,280 422,281 400,339"/>
      <ellipse class="foot-far" cx="400" cy="335" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.405s">
      <polyline class="leg leg-far" points="360,280 422,285 418,347"/>
      <ellipse class="foot-far" cx="418" cy="343" rx="13.5" ry="6"/>
    </g>

    <!-- ===== 自行车 ===== -->
    <!-- 后轮 -->
    <g transform="translate(320,365)">
      <g class="spin">
        <circle r="52" fill="none" stroke="#22303f" stroke-width="10"/>
        <circle r="43" fill="none" stroke="#cfd8e3" stroke-width="3.5"/>
        <g stroke="#a9b6c4" stroke-width="3">
          <line x1="0" y1="0" x2="41" y2="0"/>
          <line x1="0" y1="0" x2="20.5" y2="35.5"/>
          <line x1="0" y1="0" x2="-20.5" y2="35.5"/>
          <line x1="0" y1="0" x2="-41" y2="0"/>
          <line x1="0" y1="0" x2="-20.5" y2="-35.5"/>
          <line x1="0" y1="0" x2="20.5" y2="-35.5"/>
        </g>
        <circle r="7.5" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
        <circle r="3" fill="#475569"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g transform="translate(480,365)">
      <g class="spin">
        <circle r="52" fill="none" stroke="#22303f" stroke-width="10"/>
        <circle r="43" fill="none" stroke="#cfd8e3" stroke-width="3.5"/>
        <g stroke="#a9b6c4" stroke-width="3">
          <line x1="0" y1="0" x2="41" y2="0"/>
          <line x1="0" y1="0" x2="20.5" y2="35.5"/>
          <line x1="0" y1="0" x2="-20.5" y2="35.5"/>
          <line x1="0" y1="0" x2="-41" y2="0"/>
          <line x1="0" y1="0" x2="-20.5" y2="-35.5"/>
          <line x1="0" y1="0" x2="20.5" y2="-35.5"/>
        </g>
        <circle r="6" fill="#22303f"/>
      </g>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#e63946" stroke-width="7" stroke-linecap="round">
      <line x1="400" y1="365" x2="352" y2="288"/>  <!-- 立管 -->
      <line x1="352" y1="288" x2="454" y2="279"/>  <!-- 上管 -->
      <line x1="400" y1="365" x2="457" y2="288"/>  <!-- 下管 -->
      <line x1="454" y1="278" x2="462" y2="298"/>  <!-- 头管 -->
      <line x1="461" y1="296" x2="480" y2="365"/>  <!-- 前叉 -->
      <line x1="400" y1="365" x2="320" y2="365"/>  <!-- 链支 -->
      <line x1="352" y1="288" x2="320" y2="365"/>  <!-- 后上叉 -->
    </g>

    <!-- 曲柄 + 牙盘 + 脚踏 -->
    <g transform="translate(400,365)">
      <g class="crank">
        <line x1="0" y1="0" x2="26" y2="0"  stroke="#94a3b1" stroke-width="8" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="-26" y2="0" stroke="#94a3b1" stroke-width="8" stroke-linecap="round"/>
        <circle r="13" fill="#e2e8f0" stroke="#94a3b1" stroke-width="3"/>
        <g stroke="#94a3b1" stroke-width="3" stroke-linecap="round">
          <line x1="4" y1="0"   x2="12" y2="0"/>
          <line x1="1.2" y1="3.8"  x2="3.7" y2="11.4"/>
          <line x1="-3.2" y1="2.4" x2="-9.7" y2="7.5"/>
          <line x1="-3.2" y1="-2.4" x2="-9.7" y2="-7.5"/>
          <line x1="1.2" y1="-3.8" x2="3.7" y2="-11.4"/>
        </g>
        <rect x="15"  y="-3.5" width="22" height="7" rx="3" fill="#2b2d42"/>
        <rect x="-37" y="-3.5" width="22" height="7" rx="3" fill="#2b2d42"/>
      </g>
    </g>

    <!-- 链条 -->
    <path class="chain"
          d="M 320 358 L 400 350 A 15 15 0 0 1 400 380 L 320 372 A 7 7 0 0 1 320 358 Z"
          fill="none" stroke="#2b2d42" stroke-width="3.5"/>

    <!-- 车座 -->
    <path d="M 332 286 C 338 279, 358 277, 370 281 C 362 290, 340 292, 332 286 Z" fill="#2b2d42"/>

    <!-- 车把 -->
    <line x1="454" y1="278" x2="463" y2="256" stroke="#2b2d42" stroke-width="6" stroke-linecap="round"/>
    <rect x="456" y="248" width="20" height="11" rx="5.5" fill="#2b2d42"/>

    <!-- ===== 近侧腿 ===== -->
    <g class="pose" style="animation-delay:0s">
      <polyline class="leg leg-near" points="360,280 417,304 426,365"/>
      <ellipse class="foot-near" cx="426" cy="361" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.135s">
      <polyline class="leg leg-near" points="360,280 405,323 418,383"/>
      <ellipse class="foot-near" cx="418" cy="379" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.27s">
      <polyline class="leg leg-near" points="360,280 398,329 400,391"/>
      <ellipse class="foot-near" cx="400" cy="387" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.405s">
      <polyline class="leg leg-near" points="360,280 403,325 382,383"/>
      <ellipse class="foot-near" cx="382" cy="379" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.54s">
      <polyline class="leg leg-near" points="360,280 411,315 374,365"/>
      <ellipse class="foot-near" cx="374" cy="361" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.675s">
      <polyline class="leg leg-near" points="360,280 420,298 382,347"/>
      <ellipse class="foot-near" cx="382" cy="343" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.81s">
      <polyline class="leg leg-near" points="360,280 422,281 400,339"/>
      <ellipse class="foot-near" cx="400" cy="335" rx="13.5" ry="6"/>
    </g>
    <g class="pose" style="animation-delay:.945s">
      <polyline class="leg leg-near" points="360,280 422,285 418,347"/>
      <ellipse class="foot-near" cx="418" cy="343" rx="13.5" ry="6"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 尾羽 -->
    <g class="tail" fill="#e6edf4" stroke="#d3dee8" stroke-width="2">
      <path d="M 316 236 C 300 230, 286 222, 272 214 C 282 230, 292 244, 308 252 Z"/>
      <path d="M 314 252 C 298 250, 284 246, 270 240 C 282 256, 296 266, 314 268 Z"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="350" cy="248" rx="47" ry="33" fill="#f7fafc" stroke="#d3dee8" stroke-width="2"/>
