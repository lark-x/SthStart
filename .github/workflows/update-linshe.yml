name: Check Linshe updates

on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Update the pinned Linshe revision
        run: git submodule update --remote upstream/linshe
      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- upstream/linshe; then
            echo "No Linshe update found"
            exit 0
          fi
          old_sha=$(git diff --submodule=short -- upstream/linshe | sed -n 's/^-Subproject commit //p' | head -1)
          new_sha=$(git -C upstream/linshe rev-parse HEAD)
          branch="chore/update-linshe-${new_sha:0:8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add upstream/linshe
          git commit -m "chore: update Linshe to ${new_sha:0:8}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "chore: update Linshe to ${new_sha:0:8}" \
            --body "Updates the pinned Linshe revision from \`${old_sha:-unknown}\` to \`${new_sha}\`. Merge only after the portal embed and Linshe smoke checks pass."
