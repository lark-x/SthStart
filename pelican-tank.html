<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕坦克兵 · Pelican Tank 2D 动画</title>
<style>
  :root {
    --sky-top: #7ec8f2;
    --sky-bottom: #dff3ff;
    --grass: #6fae4a;
    --grass-dark: #4f8a34;
    --tank-green: #5d7a3c;
    --tank-green-dark: #3f5a26;
    --tank-green-light: #87a95c;
    --steel: #4a4f56;
    --steel-light: #767d87;
    --beak: #f2a33c;
    --beak-dark: #d1821f;
    --feather: #f7f8fa;
    --feather-shade: #d9dde3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1d2733;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    overflow: hidden;
  }

  .stage {
    width: min(92vw, 1000px);
    aspect-ratio: 8 / 5;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 3px #2f3d4d inset;
    position: relative;
  }

  svg { display: block; width: 100%; height: 100%; }

  .caption {
    color: #9fb3c8;
    font-size: 14px;
    letter-spacing: .12em;
    text-align: center;
    user-select: none;
  }

  /* ---------- 背景 ---------- */
  @keyframes cloudDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-260px); }
  }
  .clouds-a { animation: cloudDrift 26s linear infinite; }
  .clouds-b { animation: cloudDrift 42s linear infinite; }

  @keyframes sunSpin { to { transform: rotate(360deg); } }
  .sun-rays { transform-origin: 660px 92px; animation: sunSpin 40s linear infinite; }

  @keyframes hillScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }
  .hills { animation: hillScroll 30s linear infinite; }

  /* ---------- 地面滚动 ---------- */
  @keyframes groundScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-240px); }
  }
  .ground-scroll { animation: groundScroll 1.6s linear infinite; }

  /* ---------- 坦克 ---------- */
  @keyframes tankBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-3px) rotate(-.5deg); }
    50%      { transform: translateY(0) rotate(0deg); }
    75%      { transform: translateY(-2px) rotate(.5deg); }
  }
  .tank-group {
    transform-origin: 400px 380px;
    animation: tankBob .55s ease-in-out infinite;
  }

  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  .wheel { transform-box: fill-box; transform-origin: center; animation: wheelSpin .8s linear infinite; }

  /* 履带板 */
  @keyframes trackMove { to { stroke-dashoffset: -48px; } }
  .track-dash { animation: trackMove .6s linear infinite; }

  /* 炮塔后坐力 */
  @keyframes recoil {
    0%   { transform: translateX(0); }
    8%   { transform: translateX(-26px); }
    20%  { transform: translateX(6px); }
    35%  { transform: translateX(0); }
    100% { transform: translateX(0); }
  }
  .turret-group { transform-origin: 400px 300px; animation: recoil 3.4s cubic-bezier(.2,.8,.3,1) infinite; }

  /* 炮口火光 */
  @keyframes muzzleFlash {
    0%, 6%   { opacity: 1; transform: scale(1) rotate(0deg); }
    10%      { opacity: 0; transform: scale(1.7) rotate(40deg); }
    100%     { opacity: 0; }
  }
  .muzzle-flash {
    transform-box: fill-box; transform-origin: left center;
    opacity: 0;
    animation: muzzleFlash 3.4s ease-out infinite;
  }

  /* 炮弹 */
  @keyframes shellFly {
    0%, 7%   { opacity: 0; transform: translateX(0); }
    8%       { opacity: 1; transform: translateX(0); }
    34%      { opacity: 1; transform: translateX(520px); }
    36%,100% { opacity: 0; transform: translateX(540px); }
  }
  .shell { opacity: 0; animation: shellFly 3.4s linear infinite; }

  /* 烟雾 */
  @keyframes puffUp {
    0%   { opacity: .55; transform: translate(0,0) scale(.5); }
    100% { opacity: 0;   transform: translate(-46px,-54px) scale(1.8); }
  }
  .exhaust { transform-box: fill-box; transform-origin: center; opacity: 0; animation: puffUp 3.4s ease-out infinite; }
  .exhaust.e2 { animation-delay: .45s; }
  .exhaust.e3 { animation-delay: .9s; }

  /* ---------- 鹈鹕 ---------- */
  @keyframes pelicanBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  .pelican { transform-origin: 400px 250px; animation: pelicanBob .55s ease-in-out infinite reverse; }

  @keyframes headTilt {
    0%, 40%  { transform: rotate(0deg); }
    50%, 62% { transform: rotate(-6deg); }
    72%, 84% { transform: rotate(3deg); }
    100%     { transform: rotate(0deg); }
  }
  .pelican-head { transform-origin: 402px 244px; animation: headTilt 4.6s ease-in-out infinite; }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%, 97%      { transform: scaleY(.08); }
  }
  .eyelid { transform-box: fill-box; transform-origin: center; animation: blink 3.8s ease-in-out infinite; }

  /* 喉囊鼓气 */
  @keyframes pouchPuff {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.08, 1.14); }
  }
  .pouch { transform-box: fill-box; transform-origin: top center; animation: pouchPuff 2.6s ease-in-out infinite; }

  /* 头顶羽毛飘动 */
  @keyframes crestWave {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-12deg); }
  }
  .crest { transform-box: fill-box; transform-origin: bottom left; animation: crestWave 1.9s ease-in-out infinite; }

  /* 翅膀拍动 */
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50%      { transform: rotate(-16deg) scaleY(.9); }
  }
  .wing { transform-box: fill-box; transform-origin: top right; animation: wingFlap .9s ease-in-out infinite; }

  /* 举旗 */
  @keyframes flagWave {
    0%, 100% { transform: skewY(0deg); }
    25%      { transform: skewY(4deg); }
    75%      { transform: skewY(-4deg); }
  }
  .flag { transform-box: fill-box; transform-origin: left center; animation: flagWave .7s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕驾驶坦克的2D动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="var(--sky-top)"/>
      <stop offset="100%" stop-color="var(--sky-bottom)"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8ec96a"/>
      <stop offset="100%" stop-color="var(--grass-dark)"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="var(--tank-green-light)"/>
      <stop offset="55%" stop-color="var(--tank-green)"/>
      <stop offset="100%" stop-color="var(--tank-green-dark)"/>
    </linearGradient>
    <linearGradient id="turretGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#95b76a"/>
      <stop offset="100%" stop-color="var(--tank-green-dark)"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="var(--feather-shade)"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%"  stop-color="#fff6c9"/>
      <stop offset="60%" stop-color="#ffd95e"/>
      <stop offset="100%" stop-color="#ffcb3d"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <g class="sun-rays">
      <g fill="#ffe27a" opacity=".75">
        <rect x="655" y="40" width="10" height="20" rx="5"/>
        <rect x="655" y="124" width="10" height="20" rx="5"/>
        <rect x="618" y="87" width="20" height="10" rx="5"/>
        <rect x="682" y="87" width="20" height="10" rx="5"/>
        <rect x="629" y="61" width="10" height="18" rx="5" transform="rotate(-45 634 70)"/>
        <rect x="681" y="61" width="10" height="18" rx="5" transform="rotate(45 686 70)"/>
        <rect x="629" y="105" width="10" height="18" rx="5" transform="rotate(45 634 114)"/>
        <rect x="681" y="105" width="10" height="18" rx="5" transform="rotate(-45 686 114)"/>
      </g>
    </g>
    <circle cx="660" cy="92" r="34" fill="url(#sunGlow)"/>
    <circle cx="660" cy="92" r="34" fill="none" stroke="#fff0b0" stroke-width="3" opacity=".8"/>
  </g>

  <!-- 云 A -->
  <g class="clouds-a" fill="#ffffff" opacity=".92">
    <g>
      <ellipse cx="120" cy="70" rx="42" ry="22"/>
      <ellipse cx="155" cy="60" rx="34" ry="24"/>
      <ellipse cx="190" cy="72" rx="36" ry="18"/>
      <ellipse cx="480" cy="110" rx="40" ry="20"/>
      <ellipse cx="514" cy="100" rx="30" ry="22"/>
      <ellipse cx="546" cy="112" rx="32" ry="17"/>
    </g>
    <g transform="translate(1060,0)">
      <ellipse cx="120" cy="70" rx="42" ry="22"/>
      <ellipse cx="155" cy="60" rx="34" ry="24"/>
      <ellipse cx="190" cy="72" rx="36" ry="18"/>
      <ellipse cx="480" cy="110" rx="40" ry="20"/>
      <ellipse cx="514" cy="100" rx="30" ry="22"/>
      <ellipse cx="546" cy="112" rx="32" ry="17"/>
    </g>
  </g>

  <!-- 云 B -->
  <g class="clouds-b" fill="#ffffff" opacity=".7">
    <g>
      <ellipse cx="300" cy="150" rx="34" ry="16"/>
      <ellipse cx="328" cy="142" rx="26" ry="18"/>
      <ellipse cx="700" cy="55" rx="30" ry="15"/>
      <ellipse cx="724" cy="48" rx="22" ry="16"/>
    </g>
    <g transform="translate(1060,0)">
      <ellipse cx="300" cy="150" rx="34" ry="16"/>
      <ellipse cx="328" cy="142" rx="26" ry="18"/>
      <ellipse cx="700" cy="55" rx="30" ry="15"/>
      <ellipse cx="724" cy="48" rx="22" ry="16"/>
    </g>
  </g>

  <!-- 远山 -->
  <g class="hills" fill="#8fbf8a" opacity=".85">
    <path d="M0,300 Q90,225 180,300 Q250,250 330,300 Q400,255 470,300 Q560,230 650,300 Q720,265 800,300 L800,330 L0,330 Z"/>
    <path d="M400,300 Q490,225 580,300 Q650,250 730,300 Q800,255 870,300 Q960,230 1050,300 Q1120,265 1200,300 L1200,330 L400,330 Z"/>
    <path d="M-400,300 Q-310,225 -220,300 Q-150,250 -70,300 Q0,255 70,300 Q160,230 250,300 Q320,265 400,300 L400,330 L-400,330 Z"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="330" width="800" height="170" fill="url(#groundGrad)"/>
  <path d="M0,330 H800" stroke="#a5d98a" stroke-width="4"/>

  <!-- 地面滚动细节 -->
  <g class="ground-scroll">
    <g stroke="var(--grass-dark)" stroke-width="3" stroke-linecap="round" opacity=".55">
      <path d="M40,346 v-12 M46,346 v-16 M52,346 v-10"/>
      <path d="M170,352 v-14 M176,352 v-18 M182,352 v-11"/>
      <path d="M300,344 v-12 M306,344 v-16"/>
      <path d="M430,354 v-13 M436,354 v-17 M442,354 v-10"/>
      <path d="M560,345 v-14 M566,345 v-18"/>
      <path d="M690,352 v-12 M696,352 v-16 M702,352 v-10"/>
      <path d="M820,346 v-12 M826,346 v-16"/>
      <path d="M950,352 v-14 M956,352 v-18"/>
      <path d="M1080,345 v-12 M1086,345 v-16"/>
    </g>
    <g fill="#c9b487" opacity=".6">
      <ellipse cx="120" cy="470" rx="26" ry="8"/>
      <ellipse cx="480" cy="486" rx="34" ry="9"/>
      <ellipse cx="860" cy="472" rx="24" ry="7"/>
      <ellipse cx="1000" cy="488" rx="28" ry="8"/>
    </g>
  </g>

  <!-- ============ 坦克 ============ -->
  <g class="tank-group">

    <!-- 地面阴影 -->
    <ellipse cx="400" cy="452" rx="185" ry="18" fill="#000" opacity=".22" filter="url(#soft)"/>

    <!-- 尾气烟 -->
    <g>
      <circle class="exhaust e1" cx="240" cy="330" r="12" fill="#cfd6dd"/>
      <circle class="exhaust e2" cx="232" cy="334" r="9"  fill="#cfd6dd"/>
      <circle class="exhaust e3" cx="244" cy="332" r="7"  fill="#cfd6dd"/>
    </g>

    <!-- 履带总成 -->
    <g>
      <rect x="212" y="374" width="376" height="76" rx="38" fill="#2f3338"/>
      <rect x="212" y="374" width="376" height="76" rx="38" fill="none" stroke="#1c1f23" stroke-width="3"/>
      <!-- 履带板 -->
      <rect class="track-dash" x="220" y="382" width="360" height="60" rx="30"
            fill="none" stroke="#565c64" stroke-width="7" stroke-dasharray="24 24"/>
      <rect x="220" y="382" width="360" height="60" rx="30"
            fill="none" stroke="#767d87" stroke-width="2" stroke-dasharray="8 40" opacity=".8"/>

      <!-- 负重轮 -->
      <g>
        <g class="wheel"><circle cx="272" cy="412" r="27" fill="#3d434a" stroke="#22262b" stroke-width="3"/>
          <rect x="269" y="389" width="6" height="46" rx="3" fill="#6d747d"/>
          <rect x="249" y="409" width="46" height="6" rx="3" fill="#6d747d"/></g>
        <g class="wheel" style="animation-delay:-.15s"><circle cx="336" cy="412" r="27" fill="#3d434a" stroke="#22262b" stroke-width="3"/>
          <rect x="333" y="389" width="6" height="46" rx="3" fill="#6d747d"/>
          <rect x="313" y="409" width="46" height="6" rx="3" fill="#6d747d"/></g>
        <g class="wheel" style="animation-delay:-.3s"><circle cx="400" cy="412" r="27" fill="#3d434a" stroke="#22262b" stroke-width="3"/>
          <rect x="397" y="389" width="6" height="46" rx="3" fill="#6d747d"/>
          <rect x="377" y="409" width="46" height="6" rx="3" fill="#6d747d"/></g>
        <g class="wheel" style="animation-delay:-.45s"><circle cx="464" cy="412" r="27" fill="#3d434a" stroke="#22262b" stroke-width="3"/>
          <rect x="461" y="389" width="6" height="46" rx="3" fill="#6d747d"/>
          <rect x="441" y="409" width="46" height="6" rx="3" fill="#6d747d"/></g>
        <g class="wheel" style="animation-delay:-.6s"><circle cx="528" cy="412" r="27" fill="#3d434a" stroke="#22262b" stroke-width="3"/>
          <rect x="525" y="389" width="6" height="46" rx="3" fill="#6d747d"/>
          <rect x="505" y="409" width="46" height="6" rx="3" fill="#6d747d"/></g>
      </g>

      <!-- 主动轮 / 诱导轮 -->
      <g class="wheel" style="animation-duration:1.1s"><circle cx="238" cy="412" r="21" fill="#4a5057" stroke="#22262b" stroke-width="3"/>
        <g fill="#7d858f"><circle cx="238" cy="397" r="4"/><circle cx="251" cy="405" r="4"/>
        <circle cx="251" cy="421" r="4"/><circle cx="238" cy="429" r="4"/>
        <circle cx="225" cy="421" r="4"/><circle cx="225" cy="405" r="4"/></g></g>
      <g class="wheel" style="animation-duration:1.1s"><circle cx="562" cy="412" r="21" fill="#4a5057" stroke="#22262b" stroke-width="3"/>
        <g fill="#7d858f"><circle cx="562" cy="397" r="4"/><circle cx="575" cy="405" r="4"/>
        <circle cx="575" cy="421" r="4"/><circle cx="562" cy="429" r="4"/>
        <circle cx="549" cy="421" r="4"/><circle cx="549" cy="405" r="4"/></g></g>
    </g>

    <!-- 车体 -->
    <path d="M236,352 L564,352 L580,392 L220,392 Z" fill="url(#hullGrad)" stroke="#31441e" stroke-width="3"/>
    <path d="M236,352 L564,352 L568,362 L232,362 Z" fill="#9dbf74" opacity=".55"/>
    <!-- 车体装甲板线条 -->
    <g stroke="#31441e" stroke-width="2" opacity=".7">
      <line x1="300" y1="362" x2="300" y2="392"/>
      <line x1="400" y1="362" x2="400" y2="392"/>
      <line x1="500" y1="362" x2="500" y2="392"/>
    </g>
    <!-- 铆钉 -->
    <g fill="#c8d9ae" stroke="#31441e" stroke-width="1.5">
      <circle cx="262" cy="374" r="4"/><circle cx="330" cy="374" r="4"/>
      <circle cx="470" cy="374" r="4"/><circle cx="538" cy="374" r="4"/>
    </g>
    <!-- 车灯 -->
    <g>
      <circle cx="572" cy="368" r="11" fill="#ffe9a3" stroke="#31441e" stroke-width="3"/>
      <path d="M584,364 l22,-8 v24 l-22,-8 z" fill="#fff3c4" opacity=".45"/>
    </g>
    <!-- 前装甲斜板 -->
    <path d="M564,352 L596,376 L580,392 Z" fill="url(#hullGrad)" stroke="#31441e" stroke-width="3"/>

    <!-- 备用油箱/杂物 -->
    <rect x="248" y="336" width="52" height="20" rx="5" fill="#8a6b3f" stroke="#4d3a20" stroke-width="2.5"/>
    <line x1="264" y1="336" x2="264" y2="356" stroke="#4d3a20" stroke-width="2"/>
    <line x1="284" y1="336" x2="284" y2="356" stroke="#4d3a20" stroke-width="2"/>

    <!-- ============ 炮塔 ============ -->
    <g class="turret-group">
      <!-- 炮口火光 -->
      <g class="muzzle-flash">
        <path d="M614,314 l30,-16 -8,16 12,10 -30,14 6,-16 z" fill="#ffd94a"/>
        <path d="M614,314 l20,-9 -5,10 8,6 -20,8 4,-10 z" fill="#fff6cf"/>
      </g>

      <!-- 炮弹 -->
      <g class="shell">
        <ellipse cx="618" cy="314" rx="16" ry="7" fill="#3b3f45" stroke="#1a1d21" stroke-width="2"/>
        <path d="M634,314 l-8,-6 v12 z" fill="#3b3f45"/>
        <rect x="600" y="310" width="8" height="8" fill="#c9a227"/>
      </g>

      <!-- 炮管 -->
      <g>
        <rect x="470" y="304" width="156" height="22" rx="8" fill="#4a5057" stroke="#25292e" stroke-width="3"/>
        <rect x="470" y="304" width="156" height="7" rx="3.5" fill="#7a828c" opacity=".8"/>
        <rect x="604" y="299" width="24" height="32" rx="7" fill="#3a3f45" stroke="#25292e" stroke-width="3"/>
        <rect x="500" y="298" width="16" height="34" rx="5" fill="#40464c" stroke="#25292e" stroke-width="2.5"/>
      </g>

      <!-- 炮塔本体 -->
      <path d="M356,300 Q360,272 400,270 Q444,272 448,300 L452,352 L352,352 Z"
            fill="url(#turretGrad)" stroke="#31441e" stroke-width="3"/>
      <path d="M356,300 Q360,272 400,270 Q444,272 448,300 L449,310 Q400,296 355,310 Z"
            fill="#a3c47c" opacity=".55"/>
      <!-- 指挥塔 -->
      <rect x="376" y="256" width="52" height="20" rx="7" fill="#4f6d33" stroke="#31441e" stroke-width="3"/>
      <rect x="382" y="248" width="40" height="12" rx="5" fill="#718f4d" stroke="#31441e" stroke-width="2.5"/>
      <!-- 炮塔观察缝 -->
      <rect x="364" y="316" width="26" height="8" rx="4" fill="#2c3b1c"/>
      <rect x="416" y="316" width="26" height="8" rx="4" fill="#2c3b1c"/>
      <!-- 星徽 -->
      <g transform="translate(400,336)">
        <circle r="13" fill="#e9edd8" stroke="#31441e" stroke-width="2"/>
        <path d="M0,-9 L2.6,-2.8 9.3,-2.8 3.9,1.4 5.9,7.8 0,4 -5.9,7.8 -3.9,1.4 -9.3,-2.8 -2.6,-2.8 Z" fill="#d64541"/>
      </g>
      <!-- 天线 -->
      <line x1="360" y1="284" x2="336" y2="216" stroke="#2f3338" stroke-width="3" stroke-linecap="round"/>
      <circle cx="336" cy="214" r="5" fill="#d64541"/>
    </g>

    <!-- ============ 旗帜 ============ -->
    <g>
      <line x1="586" y1="352" x2="586" y2="252" stroke="#6b4f2a" stroke-width="5" stroke-linecap="round"/>
      <g class="flag">
        <path d="M586,256 L650,266 L586,286 Z" fill="#e8534e" stroke="#a8322e" stroke-width="2"/>
        <path d="M586,256 L650,266 L618,271 Z" fill="#f2716d" opacity=".7"/>
      </g>
    </g>

    <!-- ============ 鹈鹕 ============ -->
    <g class="pelican">
      <!-- 身体（探出舱口） -->
      <path d="M370,300 Q366,258 400,252 Q436,256 434,300 Q434,318 402,318 Q372,318 370,300 Z"
            fill="url(#featherGrad)" stroke="#b9bfc7" stroke-width="3"/>

      <!-- 翅膀 -->
      <g class="wing">
        <path d="M424,272 Q456,278 458,306 Q444,320 424,312 Q416,292 424,272 Z"
              fill="#eceff3" stroke="#b9bfc7" stroke-width="3"/>
